name: 同步安装包到 Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的 tag（留空则用最新 release）
        required: false
        type: string
      dry_run:
        description: 只检查、不写入（用于验证令牌与仓库权限）
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: 同步 DMG/ZIP 到 Gitee Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
        run: |
          bash scripts/sync-to-gitee.sh "${{ github.event.release.tag_name || inputs.tag }}"
